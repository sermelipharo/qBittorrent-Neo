included:
  - QBTNeo
excluded:
  - Generated
  - build
  - QBTNeo.xcodeproj

disabled_rules:
  - todo
  - trailing_comma
  # SwiftUI view builders and table column groups are naturally long.
  - type_body_length
  - function_body_length
  - cyclomatic_complexity

opt_in_rules:
  - empty_count
  - first_where
  - contains_over_first_not_nil
  - closure_spacing
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition
  - modifier_order
  - last_where
  - reduce_into
  - flatmap_over_map_reduce
  - prefer_self_in_static_references
  - private_swiftui_state
  - shorthand_optional_binding

line_length:
  warning: 160
  error: 220
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 700
  error: 1000

identifier_name:
  min_length:
    warning: 1
  max_length:
    warning: 60
  excluded:
    - id
    - up
    - dl
    - ul
    - ip
    - x
    - y

type_name:
  min_length: 2
  max_length: 60

nesting:
  type_level: 3

large_tuple:
  warning: 4

function_parameter_count:
  warning: 8
