name: CI

on:
  push:
    branches: [neo]
  pull_request:
    branches: [neo]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Core and macOS app
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: deps
        run: .github/scripts/setup-deps.sh
      # Prebuilt between runs: libtorrent (static, keyed by the script and the
      # Homebrew versions it builds against) and the core's objects (ccache).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/deps
          key: libtorrent-${{ hashFiles('scripts/build-deps.sh') }}-${{ steps.deps.outputs.deps-key }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache
          key: ccache-ci-${{ github.run_id }}
          restore-keys: ccache-
      - name: SwiftLint
        working-directory: apps/macos
        run: swiftlint lint --strict --quiet
      - name: Build the core
        run: |
          ccache --max-size=1G
          scripts/build-core.sh Release
          ccache --show-stats
      - name: Smoke test of the core
        run: |
          cmake --build build/core --target qbtneo-smoke
          build/core/qbtneo-smoke "$RUNNER_TEMP/profile" syncMainData > "$RUNNER_TEMP/smoke.txt"
          head -c 600 "$RUNNER_TEMP/smoke.txt"; echo
          grep -q serverState "$RUNNER_TEMP/smoke.txt"
      - name: Build the app
        working-directory: apps/macos
        run: |
          xcodegen generate
          xcodebuild build -project QBTNeo.xcodeproj -scheme QBTNeo -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO -quiet
